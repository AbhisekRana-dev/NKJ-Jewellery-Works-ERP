# Load local environment variables from backend/.env when present.
# The start-backend.ps1 script also validates required values before launch.
spring.config.import=optional:file:./.env[.properties]

# HTTP server
server.port=${SERVER_PORT:8086}
server.error.include-message=never
server.error.include-binding-errors=never

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nkj_billing}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000

# Hibernate remains in update mode for compatibility with the original invoice tables.
# Flyway owns the new ERP schema and its compatibility callback.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.open-in-view=false

# JSON serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# Administrator credentials and TOTP secret must be supplied in backend/.env.
nkj.admin.username=${ADMIN_USERNAME:admin2026}
nkj.admin.password=${ADMIN_PASSWORD:}
nkj.totp.secret=${TOTP_SECRET:}

# Restrict browser API calls to the local Vite origins by default.
# For deployment, set CORS_ALLOWED_ORIGINS to the exact frontend origin(s).
nkj.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Flyway migrations. Baseline version 0 lets V1 create the ERP tables in an
# existing invoice database; beforeMigrate.sql repairs legacy singleton tables.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.callback-locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# The existing default invoice PIN verifier corresponds to initial local PIN 770722.
# Replace both values before any public deployment; never store the PIN in frontend code.
nkj.invoice.pin-salt=${INVOICE_PIN_SALT:ZnkGTi0U5Vl0BDtV5dELMw==}
nkj.invoice.pin-hash=${INVOICE_PIN_HASH:dfsYAmBBM/TnshFJfekj9hEotWzoDyuUHEW58xc2D/E=}

# First-time setup email OTP. Configure an SMTP provider/app password in backend/.env.
nkj.setup.email=${FIRST_SETUP_EMAIL:rabhisek2030@gmail.com}
nkj.setup.mail-from=${MAIL_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Primary Anandabazar Patrika feed. Must be an authorized feed adapter; the ERP does not scrape e-paper pages.
nkj.rates.newspaper.enabled=${ABP_RATE_FEED_ENABLED:false}
nkj.rates.newspaper.url=${ABP_RATE_FEED_URL:}
nkj.rates.newspaper.api-key=${ABP_RATE_FEED_API_KEY:}

# Kolkata-specific fallback (for example, an authorized All India Bullion integration).
# Do not use the public rate page URL here: its terms prohibit scraping/copying its rates without permission.
nkj.rates.kolkata-fallback.enabled=${AIB_RATE_FEED_ENABLED:false}
nkj.rates.kolkata-fallback.url=${AIB_RATE_FEED_URL:}
nkj.rates.kolkata-fallback.api-key=${AIB_RATE_FEED_API_KEY:}


# Owner-managed jewellery catalogue image storage. Keep this directory on a persistent disk.
nkj.designs.upload-dir=${DESIGNS_UPLOAD_DIR:uploads/designs}
# Public website origin encoded into temporary mobile-upload QR links.
# Set this to the HTTPS frontend origin reachable by the owner's phone.
nkj.designs.mobile-upload-base-url=${DESIGNS_MOBILE_UPLOAD_BASE_URL:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=210MB
