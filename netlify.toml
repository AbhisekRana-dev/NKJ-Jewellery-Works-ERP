[build]
  base = "NKJ-Jewellery-Works-ERP/frontend"
  command = "npm run build"
  publish = "dist"

# Keep API requests same-origin from the browser. Netlify proxies them to Render,
# avoiding browser CORS preflight problems while preserving the existing /api client.
[[redirects]]
  from = "/api/*"
  to = "https://nkj-jewellery-works-api.onrender.com/api/:splat"
  status = 200
  force = true

# React Router SPA fallback (must remain after the API proxy rule).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
