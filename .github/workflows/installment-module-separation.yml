          )
          assert first.get("id") and first.get("customerId"), "First invoice did not create/link a customer."
          assert "customerEmail" not in first and "email" not in first, "Invoice save response exposed customer email."
          assert "customerEmail" not in first.get("details", {}) and "email" not in first.get("details", {}), "Invoice detail payload exposed customer email."
          first_customer_id = first["customerId"]

          second = save_invoice(
              "CI Different Display Name", "9876543210",
              "alpha@example.test", "Customer address from second invoice",
              "CI-CUSTOMER-SECOND-001"
          )
          assert second.get("customerId") == first_customer_id, "Same phone created a second customer."
          assert "customerEmail" not in second and "email" not in second, "Invoice response exposed a supplied legacy email field."
          assert "customerEmail" not in second.get("details", {}) and "email" not in second.get("details", {}), "Invoice details exposed a supplied legacy email field."
          preserved = sql(
              "SELECT name || '|' || COALESCE(email,'') || '|' || COALESCE(address,'') "
