          assert retry_one.get("id") == retry_two.get("id"), "Repeated invoice save created a second invoice."
          assert retry_one.get("customerId") == retry_two.get("customerId"), "Repeated invoice save changed Customer ID."
          assert sql("SELECT COUNT(*) FROM customers WHERE normalized_phone='9876543214'") == "1", (
              "Repeated invoice save created duplicate customers."
          )
          assert sql("SELECT COUNT(*) FROM invoices WHERE idempotency_key='CI-CUSTOMER-IDEMPOTENT-001'") == "1", (
              "Repeated invoice save created duplicate invoice rows."
