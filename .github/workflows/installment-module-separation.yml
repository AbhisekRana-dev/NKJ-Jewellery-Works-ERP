name: Verify Jewellery ERP build and installment separation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: NKJ-Jewellery-Works-ERP/frontend/package-lock.json
      - run: npm ci
        working-directory: NKJ-Jewellery-Works-ERP/frontend
      - run: npm run build
        working-directory: NKJ-Jewellery-Works-ERP/frontend
      - name: Verify customer email fields are absent from invoice and customer UI
        run: |
          ! grep -Eq 'Email Address|customerEmail|customer\.email' NKJ-Jewellery-Works-ERP/frontend/src/features/invoices/InvoicePages.jsx
          python3 - <<'PY'
          from pathlib import Path
          config = Path("NKJ-Jewellery-Works-ERP/frontend/src/features/admin/moduleConfig.js").read_text()
          customer = config.split("  customers: {", 1)[1].split("  suppliers: {", 1)[0]
          assert '"email"' not in customer and '"Email"' not in customer, "Customer Management still defines an email field or column."
          PY
      - name: Verify WhatsApp opens the invoice customer's chat
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("NKJ-Jewellery-Works-ERP/frontend/src/features/invoices/InvoicePages.jsx").read_text()
          styles = Path("NKJ-Jewellery-Works-ERP/frontend/src/features/invoices/InvoicePages.css").read_text()
          assert "async function createInvoiceSharePdfFile(invoice)" in source
          assert "function collectInvoicePrintStyles()" in source
          assert "document.styleSheets" in source
          assert 'rule.conditionText || rule.media?.mediaText' in source
          assert '31mm 3mm' in source and 'grid-template-columns: 31mm 3mm minmax(0, 1fr)' in styles
          assert '["width", "291mm"]' in source
          assert 'margin: [3, 3, 3, 3]' in source
          assert 'orientation: "landscape"' in source
          assert '["zoom", "1"]' in source
          assert 'source.removeAttribute("id")' in source
          assert 'clone.id = originalId' in source
          assert 'new File([blob], fileName, { type: "application/pdf" })' in source
          assert "function normalizeWhatsAppPhone(value)" in source
          assert 'replace(/\\D/g, "")' in source
          assert 'https://wa.me/\u0024{whatsappPhone}' in source
          assert 'window.open(chatUrl, "_blank")' in source
          assert "encodeURIComponent(message)" not in source
          assert "?text=" not in source
          assert "await navigator.share({ files: [file] });" not in source
          assert "downloadInvoicePdfFile(file);" in source
          assert "shareInProgressRef.current" in source
          print("Invoice PDF generation, customer-number routing, no-prefilled-message, and download checks passed.")
          PY

      - name: Verify owner sidebar navigation and double-click behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shell = Path("NKJ-Jewellery-Works-ERP/frontend/src/shared/layouts/OwnerShell.jsx").read_text()
          nav_start = shell.index("const ownerNavigation = [")
          nav_end = shell.index(chr(10) + "];", nav_start)
          nav_items = shell[nav_start:nav_end].count('["')
          assert nav_items == 30, f"Expected 30 owner sidebar items, found {nav_items}."
          assert "group.items.map(([key, label, to, Icon, shortLabel])" in shell
          assert '["transactions", "Transactions", "/transactions", ArrowLeftRight, "Trans"]' in shell
          assert '["design-catalog", "Jewellery Catalog Management", "/design-catalog", Gem, "Designs"]' in shell
          assert "const handleSidebarNavigationClick = (key) => {" in shell
          assert "SIDEBAR_NAV_CLICK_KEY" in shell
          assert "window.sessionStorage.getItem(SIDEBAR_NAV_CLICK_KEY)" in shell
          assert "window.sessionStorage.setItem(SIDEBAR_NAV_CLICK_KEY" in shell
          assert "SIDEBAR_DOUBLE_CLICK_MS" in shell
          assert "const handleSidebarToggle = () => {" in shell
          assert "onClick={handleSidebarToggle}" in shell
          assert "data-nav-key={key}" in shell
          assert '<small className="nkj-owner-nav-short-label" aria-hidden="true">' in shell

          app = Path("NKJ-Jewellery-Works-ERP/frontend/src/app/App.jsx").read_text()
          assert '<Route path="/transactions" element={<OwnerOnly><TransactionsPage /></OwnerOnly>} />' in app
          assert '<Route path="/design-catalog" element={<OwnerOnly><JewelleryCatalogAdminPage /></OwnerOnly>} />' in app
          assert '<div className="app-content">' in app

          css = Path("NKJ-Jewellery-Works-ERP/frontend/src/shared/layouts/OwnerShell.css").read_text()
          assert "var(--nkj-owner-collapsed-width, 82px)" in css
          assert ".nkj-owner-nav-short-label" in css
          assert "nkj-owner-sidebar.is-collapsed" in css
          assert "@media" in css
          print("Owner sidebar routes, compact labels, persistent navigation click handling and toggle checks passed.")
          PY

      - name: Verify source-aware cash flow classification and history
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("NKJ-Jewellery-Works-ERP")
          cash = (root / "backend/src/main/java/com/nkj/billing/service/CashFlowService.java").read_text()
          modules = (root / "backend/src/main/java/com/nkj/billing/service/ErpModuleService.java").read_text()
          invoice = (root / "backend/src/main/java/com/nkj/billing/controller/InvoiceController.java").read_text()
          migration = (root / "backend/src/main/resources/db/migration/V23__cash_flow_transaction_ledger.sql").read_text()
          page = (root / "frontend/src/features/transactions/TransactionsPage.jsx").read_text()
          styles = (root / "frontend/src/features/transactions/TransactionsPage.css").read_text()

          for key in (
              "INVOICE:INITIAL_COLLECTION",
              "PAYMENTS:CUSTOMER_RECEIPT",
              "PRE_BOOKINGS:ADVANCE_RECEIPT",
              "INSTALLMENTS:DOWN_PAYMENT",
              "INSTALLMENTS:INSTALLMENT_RECEIPT",
          ):
              assert key in cash, f"Missing Incoming source rule: {key}"
          for key in (
              "EXPENSES:EXPENSE_PAYMENT",
              "PURCHASES:SUPPLIER_PAYMENT",
              "SALARY:INITIAL_SALARY_PAYMENT",
              "SALARY_PAYMENTS:SALARY_PAYMENT",
              "REFUNDS:CUSTOMER_REFUND",
          ):
              assert key in cash, f"Missing Outgoing source rule: {key}"

          for operation in (
              '"PRE_BOOKINGS", "ADVANCE_RECEIPT"',
              '"PAYMENTS", "CUSTOMER_RECEIPT"',
              '"EXPENSES", "EXPENSE_PAYMENT"',
              '"PURCHASES", "SUPPLIER_PAYMENT"',
              '"SALARY", "INITIAL_SALARY_PAYMENT"',
              '"SALARY_PAYMENTS", "SALARY_PAYMENT"',
              '"INSTALLMENTS", "DOWN_PAYMENT"',
              '"INSTALLMENTS", "INSTALLMENT_RECEIPT"',
          ):
              assert operation in modules, f"Missing actual-payment source hook: {operation}"
          assert '"INVOICE", "INITIAL_COLLECTION"' in invoice

          assert "ON CONFLICT DO NOTHING" in cash, "Cash movements must be idempotent across every unique key."
          assert "verifySameMovement(" in cash, "A reused source event key must be checked against the original movement."
          assert "This Idempotency-Key has already been used for a different cash transaction." in cash
          assert "LIMIT 2000" not in cash, "The Cashbook API must not truncate older transaction history."
          assert "status='POSTED'" in cash and "netCashFlow" in cash
          assert "uq_cash_transactions_source_event" in migration
          assert "uq_cash_transactions_idempotency" in migration

          assert 'row.direction === "INCOMING"' in page, "Rows must be classified using the source-derived direction."
          assert '["INCOMING", "Incoming"]' in page and '["OUTGOING", "Outgoing"]' in page
          assert 'incoming ? "+" : "−"' in page
          assert "is-incoming" in styles and "is-outgoing" in styles
          assert "#16834a" in styles and "#bd3030" in styles
          assert "Only recorded payments and receipts appear here" in page

          assert 'module.equals("payments")' in modules
          assert "A customer receipt must contain an amount greater than zero." in modules
          assert '? "PENDING" :' in modules and "paymentStatus" in modules
          assert 'cashFlow.recordMovement("EXPENSES", "EXPENSE_PAYMENT"' in modules
          assert 'cashFlow.recordMovement("PURCHASES", "SUPPLIER_PAYMENT"' in modules
          expense_hook = modules.split('cashFlow.recordMovement("EXPENSES", "EXPENSE_PAYMENT"', 1)[1].split(");", 1)[0]
          purchase_hook = modules.split('cashFlow.recordMovement("PURCHASES", "SUPPLIER_PAYMENT"', 1)[1].split(");", 1)[0]
          assert "shopToday()" in expense_hook, "Initial expense cash should be dated when it is actually posted."
          assert "shopToday()" in purchase_hook, "Initial supplier cash should be dated when it is actually paid."
          print("Source-aware cash flow rules, signs, filters, idempotency and full-history checks passed.")
          PY

  backend-build-and-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nkj_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nkj_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -DskipTests package
        working-directory: NKJ-Jewellery-Works-ERP/backend

      # Apply the historical schema first, so the V20 migration is exercised
      # against real legacy booking/schedule/payment rows rather than an empty DB.
      - name: Start backend at schema version 19
        working-directory: NKJ-Jewellery-Works-ERP/backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/nkj_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          ADMIN_USERNAME: ci-owner
          ADMIN_PASSWORD: ci-only-password
          TOTP_SECRET: JBSWY3DPEHPK3PXP
        run: |
          java -jar target/nkj-billing-1.0.0.jar --spring.flyway.target=19 > /tmp/nkj-v19.log 2>&1 &
          echo $! > /tmp/nkj-backend.pid
          for attempt in $(seq 1 90); do
            if psql "postgresql://postgres:postgres@localhost:5432/nkj_test" -tAc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='19' AND success=true" 2>/dev/null | grep -q '^1$'; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/nkj-backend.pid)" 2>/dev/null; then
              cat /tmp/nkj-v19.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/nkj-v19.log
          exit 1

      - name: Seed one legacy EMI and one genuine Pre-Booking
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/nkj_test" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO invoices(invoice_no, invoice_date, customer_name, mobile, address, grand_total)
          VALUES ('NKJ-CI-EMI-001', CURRENT_DATE, 'EMI Migration Customer', '9000000001', 'EMI address', 1000.00);

          INSERT INTO bookings(
              booking_no, invoice_no, invoice_id, customer_name, mobile, booking_date,
              description, metal_type, purity, estimated_weight, estimated_rate,
              estimated_value, making_estimate, advance_amount, remaining_amount,
              delivery_date, status, is_installment_plan, total_installments,
              payment_frequency, down_payment_date, down_payment_method,
              down_payment_reference_no, down_payment_recorded_by, converted_at
          )
          SELECT 'NKJ-CI-LEGACY-EMI', i.invoice_no, i.id, i.customer_name, i.mobile,
                 CURRENT_DATE, 'Legacy EMI fixture', 'GOLD', '22K', 0, 0,
                 i.grand_total, 0, 500, 400, CURRENT_DATE, 'OPEN', TRUE, 2,
                 'MONTHLY', CURRENT_DATE, 'UPI', 'CI-DOWNPAY', 'CI', NOW()
            FROM invoices i WHERE i.invoice_no='NKJ-CI-EMI-001';

          INSERT INTO installments(booking_id, installment_no, due_date, amount_due, amount_paid, remaining_amount, payment_status)
          SELECT b.id, 1, CURRENT_DATE + 30, 250, 100, 150, 'PARTIAL'
            FROM bookings b WHERE b.booking_no='NKJ-CI-LEGACY-EMI';
          INSERT INTO installments(booking_id, installment_no, due_date, amount_due, amount_paid, remaining_amount, payment_status)
          SELECT b.id, 2, CURRENT_DATE + 60, 250, 0, 250, 'PENDING'
            FROM bookings b WHERE b.booking_no='NKJ-CI-LEGACY-EMI';

          INSERT INTO installment_payments(
              installment_id, booking_id, entry_type, payment_date, amount,
              payment_method, reference_no, idempotency_key, recorded_by
          )
          SELECT s.id, s.booking_id, 'INSTALLMENT', CURRENT_DATE, 100,
                 'UPI', 'CI-INSTALLMENT-RECEIPT', 'CI-EMI-PAY-1', 'CI'
            FROM installments s JOIN bookings b ON b.id=s.booking_id
           WHERE b.booking_no='NKJ-CI-LEGACY-EMI' AND s.installment_no=1;

          INSERT INTO installment_payments(
              installment_id, booking_id, entry_type, payment_date, amount,
              payment_method, reference_no, idempotency_key, recorded_by
          )
          SELECT NULL, b.id, 'DOWN_PAYMENT', CURRENT_DATE, 500,
                 'UPI', 'CI-DOWNPAY', 'CI-EMI-DOWNPAY-1', 'CI'
            FROM bookings b WHERE b.booking_no='NKJ-CI-LEGACY-EMI';

          INSERT INTO installment_payment_reversals(
              payment_id, reversal_date, amount, reason, idempotency_key, recorded_by
          )
          SELECT p.id, CURRENT_DATE, 10, 'CI fixture reversal', 'CI-EMI-REV-1', 'CI'
            FROM installment_payments p WHERE p.idempotency_key='CI-EMI-PAY-1';

          INSERT INTO bookings(
              booking_no, customer_name, mobile, booking_date, description,
              metal_type, purity, estimated_value, making_estimate,
              advance_amount, remaining_amount, status, is_installment_plan
          )
          VALUES (
              'NKJ-CI-GENUINE-BOOKING', 'Pre-Booking Customer', '9000000002',
              CURRENT_DATE, 'Genuine pre-booking fixture', 'GOLD', '22K',
              2000, 0, 200, 1800, 'OPEN', FALSE
          );

          INSERT INTO installments(booking_id, installment_no, due_date, amount_due, amount_paid, remaining_amount, payment_status)
          SELECT b.id, 1, CURRENT_DATE + 20, 1000, 0, 1000, 'PENDING'
            FROM bookings b WHERE b.booking_no='NKJ-CI-GENUINE-BOOKING';

          -- Existing duplicate phone rows are deliberately retained by V22.
          INSERT INTO customers(customer_code, name, phone, email, address)
          VALUES
            ('NKJ-CI-CUSTOMER-DUP-01', 'Legacy Customer Primary', '+91 98765-00000', 'primary@example.test', 'Primary saved address'),
            ('NKJ-CI-CUSTOMER-DUP-02', 'Legacy Customer Duplicate', '9876500000', 'duplicate@example.test', 'Duplicate saved address');
          COMMIT;
          SQL

      - name: Apply V20 and verify module separation
        working-directory: NKJ-Jewellery-Works-ERP/backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/nkj_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          ADMIN_USERNAME: ci-owner
          ADMIN_PASSWORD: ci-only-password
          TOTP_SECRET: JBSWY3DPEHPK3PXP
        run: |
          kill "$(cat /tmp/nkj-backend.pid)"
          for attempt in $(seq 1 30); do
            kill -0 "$(cat /tmp/nkj-backend.pid)" 2>/dev/null || break
            sleep 1
          done
          java -jar target/nkj-billing-1.0.0.jar > /tmp/nkj-v20.log 2>&1 &
          echo $! > /tmp/nkj-backend.pid
          for attempt in $(seq 1 90); do
            if psql "postgresql://postgres:postgres@localhost:5432/nkj_test" -tAc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='23' AND success=true" 2>/dev/null | grep -q '^1$'; then
              break
            fi
            if ! kill -0 "$(cat /tmp/nkj-backend.pid)" 2>/dev/null; then
              cat /tmp/nkj-v20.log
              exit 1
            fi
            sleep 2
          done
          psql "postgresql://postgres:postgres@localhost:5432/nkj_test" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE n BIGINT;
          BEGIN
            SELECT COUNT(*) INTO n
              FROM installment_accounts a
              JOIN invoices i ON i.id=a.invoice_id
             WHERE i.invoice_no='NKJ-CI-EMI-001';
            IF n <> 1 THEN RAISE EXCEPTION 'Expected exactly one migrated EMI account, found %', n; END IF;

            SELECT COUNT(*) INTO n
              FROM installment_schedules s
              JOIN installment_accounts a ON a.id=s.account_id
             WHERE a.invoice_no='NKJ-CI-EMI-001';
            IF n <> 2 THEN RAISE EXCEPTION 'Expected 2 migrated EMI schedules, found %', n; END IF;

            SELECT COUNT(*) INTO n
              FROM installment_transactions p
              JOIN installment_accounts a ON a.id=p.account_id
             WHERE a.invoice_no='NKJ-CI-EMI-001';
            IF n <> 2 THEN RAISE EXCEPTION 'Expected down-payment and installment transactions, found %', n; END IF;

            SELECT COUNT(*) INTO n
              FROM installment_transaction_reversals r
              JOIN installment_transactions p ON p.id=r.transaction_id
              JOIN installment_accounts a ON a.id=p.account_id
             WHERE a.invoice_no='NKJ-CI-EMI-001';
            IF n <> 1 THEN RAISE EXCEPTION 'Expected 1 migrated payment reversal, found %', n; END IF;

            SELECT COUNT(*) INTO n
              FROM pre_booking_bills;
            IF n <> 1 THEN RAISE EXCEPTION 'Expected only the genuine Pre-Booking in the Pre-Booking filter, found %', n; END IF;

            SELECT COUNT(*) INTO n FROM legacy_booking_records
             WHERE booking_no='NKJ-CI-LEGACY-EMI';
            IF n <> 1 THEN RAISE EXCEPTION 'Legacy EMI booking was not preserved in archive'; END IF;

            SELECT COUNT(*) INTO n FROM legacy_installments
             WHERE booking_id=(SELECT id FROM legacy_booking_records WHERE booking_no='NKJ-CI-LEGACY-EMI');
            IF n <> 2 THEN RAISE EXCEPTION 'Legacy EMI schedules were not preserved in archive'; END IF;

            SELECT COUNT(*) INTO n FROM legacy_installment_payments
             WHERE booking_id=(SELECT id FROM legacy_booking_records WHERE booking_no='NKJ-CI-LEGACY-EMI');
            IF n <> 2 THEN RAISE EXCEPTION 'Legacy EMI receipts were not preserved in archive'; END IF;

            IF to_regclass('public.bookings') IS NOT NULL
               OR to_regclass('public.installments') IS NOT NULL
               OR to_regclass('public.installment_payments') IS NOT NULL THEN
              RAISE EXCEPTION 'Old shared tables are still exposed under active names';
            END IF;

            IF EXISTS (
                SELECT 1 FROM information_schema.columns
                 WHERE table_schema='public'
                   AND table_name='pre_booking_bills'
                   AND column_name IN ('is_installment_plan','total_installments','payment_frequency','plan_idempotency_key','down_payment_date')
            ) THEN
              RAISE EXCEPTION 'Dedicated Pre-Booking table contains EMI-only columns';
            END IF;

            SELECT COUNT(*) INTO n
              FROM installment_schedules s
              JOIN installment_accounts a ON a.id=s.account_id
             WHERE a.invoice_no IS NULL;
            IF n <> 0 THEN RAISE EXCEPTION 'A genuine Pre-Booking schedule leaked into EMI schedules'; END IF;

            IF EXISTS (
                SELECT 1 FROM information_schema.columns
                 WHERE table_schema='public'
                   AND table_name IN ('installment_accounts','installment_schedules','installment_transactions')
                   AND column_name IN ('booking_id','legacy_booking_id')
            ) THEN
              RAISE EXCEPTION 'An active EMI table still has a Pre-Booking/booking relationship';
            END IF;

            SELECT COUNT(*) INTO n FROM invoices WHERE invoice_no='NKJ-CI-EMI-001';
            IF n <> 1 THEN RAISE EXCEPTION 'The original invoice was not preserved'; END IF;

            SELECT COUNT(*) INTO n FROM customers
             WHERE customer_code IN ('NKJ-CI-CUSTOMER-DUP-01','NKJ-CI-CUSTOMER-DUP-02');
            IF n <> 2 THEN RAISE EXCEPTION 'V22 removed one of the existing duplicate-phone customer rows'; END IF;

            SELECT COUNT(*) INTO n FROM customers
             WHERE normalized_phone='9876500000';
            IF n <> 1 THEN RAISE EXCEPTION 'V22 did not select exactly one canonical normalized phone'; END IF;

            SELECT COUNT(*) INTO n FROM customers
             WHERE customer_code IN ('NKJ-CI-CUSTOMER-DUP-01','NKJ-CI-CUSTOMER-DUP-02')
               AND email IS NOT NULL AND address IS NOT NULL;
            IF n <> 2 THEN RAISE EXCEPTION 'V22 failed to preserve customer email/address on legacy duplicate rows'; END IF;

            IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                 WHERE table_schema='public' AND table_name='invoices' AND column_name='customer_email'
            ) THEN
              RAISE EXCEPTION 'V22 did not add customer email to saved invoices';
            END IF;

            IF NOT EXISTS (
                SELECT 1 FROM pg_indexes
                 WHERE schemaname='public' AND tablename='customers'
                   AND indexname='uq_customers_normalized_phone'
            ) THEN
              RAISE EXCEPTION 'V22 did not create the normalized-phone unique index';
            END IF;
          END $$;
          SQL
      - name: Verify live Pre-Booking and EMI API independence
        env:
          DB_URL: jdbc:postgresql://localhost:5432/nkj_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: |
          set -euo pipefail
          DB="postgresql://postgres:postgres@localhost:5432/nkj_test"

          # Seed a second saved invoice that can be converted by the real API.
          psql "$DB" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO invoices(invoice_no, invoice_date, customer_name, mobile, address, grand_total)
          VALUES ('NKJ-CI-NEW-EMI-002',
                  (CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::DATE,
                  'New EMI API Customer', '9000000003', 'API EMI address', 900.00);
          SQL

          # Wait until the migrated backend has finished starting.
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8086/api/auth/session || true)
            if [ "$code" != "000" ]; then break; fi
            sleep 2
          done
          if [ "${code:-000}" = "000" ]; then
            echo "Backend did not become reachable."
            cat /tmp/nkj-v20.log
            exit 1
          fi

          CHALLENGE_JSON=$(curl -fsS -X POST http://localhost:8086/api/auth/login \
            -H 'Content-Type: application/json' \
            --data '{"username":"ci-owner","password":"ci-only-password"}')
          CHALLENGE_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["challengeId"])' <<< "$CHALLENGE_JSON")
          OTP=$(python3 - <<'PY'
          import base64, hashlib, hmac, struct, time
          secret = "JBSWY3DPEHPK3PXP"
          key = base64.b32decode(secret + "=" * ((8 - len(secret) % 8) % 8))
          counter = int(time.time() // 30)
          digest = hmac.new(key, struct.pack(">Q", counter), hashlib.sha1).digest()
          offset = digest[-1] & 0x0F
          binary = int.from_bytes(digest[offset:offset + 4], "big") & 0x7FFFFFFF
          print(f"{binary % 1000000:06d}")
          PY
          )
          VERIFY_JSON=$(curl -fsS -X POST http://localhost:8086/api/auth/verify \
            -H 'Content-Type: application/json' \
            --data "{\"challengeId\":\"$CHALLENGE_ID\",\"code\":\"$OTP\"}")
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "$VERIFY_JSON")
          AUTH=(-H "Authorization: Bearer $TOKEN")

          TODAY=$(psql "$DB" -tAc "SELECT (CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::DATE")
          FIRST_DUE=$(date -u -d "$TODAY + 7 days" +%F)
          DUE_DAY=$(date -u -d "$FIRST_DUE" +%d)
          INVOICE_ID=$(psql "$DB" -tAc "SELECT id FROM invoices WHERE invoice_no='NKJ-CI-NEW-EMI-002'")
          PREBOOKINGS_BEFORE=$(psql "$DB" -tAc "SELECT COUNT(*) FROM pre_booking_bills")
          ACCOUNTS_BEFORE=$(psql "$DB" -tAc "SELECT COUNT(*) FROM installment_accounts")
          SCHEDULES_BEFORE=$(psql "$DB" -tAc "SELECT COUNT(*) FROM installment_schedules")
          TRANSACTIONS_BEFORE=$(psql "$DB" -tAc "SELECT COUNT(*) FROM installment_transactions")

          PLAN_JSON=$(curl -fsS -X POST http://localhost:8086/api/admin/installments/plans \
            "${AUTH[@]}" -H 'Content-Type: application/json' -H 'Idempotency-Key: CI-API-PLAN-002' \
            --data "{\"invoiceId\":$INVOICE_ID,\"downPayment\":100,\"installmentCount\":2,\"paymentFrequency\":\"MONTHLY\",\"firstDueDate\":\"$FIRST_DUE\",\"downPaymentDate\":\"$TODAY\",\"dueDay\":$DUE_DAY,\"downPaymentMethod\":\"Cash\",\"downPaymentReferenceNo\":\"CI-EMI-DP\"}")
          ACCOUNT_ID=$(python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["success"] is True; print(x["accountId"])' <<< "$PLAN_JSON")

